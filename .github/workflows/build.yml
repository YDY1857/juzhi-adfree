name: Build AdFree Dylib

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile arm64 iOS dylib
        run: |
          set -e
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "iPhoneOS SDK: $SDK"
          xcrun --sdk iphoneos clang \
            -arch arm64 \
            -miphoneos-version-min=13.0 \
            -isysroot "$SDK" \
            -dynamiclib \
            -O2 \
            -Wl,-flat_namespace \
            -Wl,-undefined,dynamic_lookup \
            -install_name @executable_path/Frameworks/AdFree.dylib \
            -o AdFree.dylib AdFree.c
          echo "----- build ok -----"
          ls -l AdFree.dylib
          file AdFree.dylib
          xcrun --sdk iphoneos otool -hv AdFree.dylib | head -6

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AdFree-dylib
          path: AdFree.dylib
          if-no-files-found: error
